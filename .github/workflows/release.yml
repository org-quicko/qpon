name: Release Docker Image on Docker Hub
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npx oxlint --type-aware

      - name: Unit tests
        working-directory: api
        run: npm run test

      # Integration and e2e start a postgres:18 container through
      # testcontainers and run the real migrations against it. The ubuntu
      # runner already has a Docker daemon, so no service container is needed.
      - name: Integration tests
        working-directory: api
        run: npm run test:integration

      - name: End-to-end tests
        working-directory: api
        run: npm run test:e2e

  docker-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from Git tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Git tag: ${GITHUB_REF_NAME}"
          echo "Docker version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Runners start with an empty BuildKit cache; persist layers between
          # releases so unchanged `npm ci` and build stages are reused.
          # mode=max also caches the intermediate builder stages.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            labsatquicko/qpon:${{ steps.version.outputs.version }}
            labsatquicko/qpon:latest
