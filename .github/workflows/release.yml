name: Release Docker Image on Docker Hub
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  docker-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from Git tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Git tag: ${GITHUB_REF_NAME}"
          echo "Docker version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Runners start with an empty BuildKit cache; persist layers between
          # releases so unchanged `npm ci` and build stages are reused.
          # mode=max also caches the intermediate builder stages.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            labsatquicko/qpon:${{ steps.version.outputs.version }}
            labsatquicko/qpon:latest
